# nginx als Load Balancer vor den drei Flask-Instanzen.

# Die Gruppe der Backend-Server. nginx verteilt die Anfragen reihum ("Round Robin").
upstream flask_app {
    # Fällt eine Instanz 3x aus, wird sie 10 Sekunden lang übersprungen.
    server app1:8000 max_fails=3 fail_timeout=10s;
    server app2:8000 max_fails=3 fail_timeout=10s;
    server app3:8000 max_fails=3 fail_timeout=10s;
}

server {
    listen 80;
    server_tokens off;            # nginx-Version nicht verraten
    client_max_body_size 16k;     # passt zu MAX_CONTENT_LENGTH in config.py

    # API und Health-Check an die Flask-Instanzen weiterreichen
    location ~ ^/(api/|health$) {
        proxy_pass http://flask_app;

        # Der App mitteilen, wer der echte Client ist (wird von ProxyFix ausgewertet)
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Antwortet eine Instanz nicht, die nächste probieren
        proxy_next_upstream error timeout http_502 http_503;

        # Nur für die Schul-Demo: zeigt im Browser (DevTools -> Netzwerk), welche
        # Instanz geantwortet hat. In echter Produktion entfernen.
        add_header X-Served-By $upstream_addr always;
    }

    # Alles andere: das Frontend (HTML/CSS/JS) als statische Dateien
    location / {
        root  /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ =404;

        # Schützende Header für die HTML-Seiten.
        # CSP: Es werden nur eigene Dateien geladen (keine CDNs, keine fremden Skripte).
        # 'self' deckt Skripte, Styles, Schriften und die API (gleiche Herkunft) ab.
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        # HSTS: erst aktivieren, wenn die Seite dauerhaft über HTTPS läuft.
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
}
