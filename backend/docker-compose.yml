# Startet die komplette Umgebung mit:  docker compose up --build
#
#   Browser ──> nginx (Load Balancer, Port 8080)
#                 ├──> app1 (Flask + gunicorn)
#                 ├──> app2 (Flask + gunicorn)
#                 └──> app3 (Flask + gunicorn)
#                         ├──> db    (PostgreSQL: Benutzerkonten)
#                         └──> redis (gemeinsame Rate-Limit-Zähler)
#
# Alle Passwörter kommen aus der Datei .env (siehe .env.example).

# Gemeinsame Einstellungen für alle drei App-Instanzen (YAML-"Anker", spart Wiederholung)
x-app: &app
  build: .
  env_file: .env
  environment:
    # Diese Werte überschreiben die aus .env, weil in Docker andere Adressen gelten
    DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    RATELIMIT_STORAGE_URI: redis://redis:6379/0
    TRUST_PROXY: "true"   # Anfragen kommen über nginx
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  app1: *app
  app2: *app
  app3: *app

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # nginx liefert auch gleich das Frontend aus (gleiche Adresse -> keine CORS-Probleme)
      - ../frontend:/usr/share/nginx/html:ro
    depends_on:
      app1:
        condition: service_healthy
      app2:
        condition: service_healthy
      app3:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data   # Daten bleiben beim Neustart erhalten
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    # Kein "ports:" -> die Datenbank ist von außen nicht erreichbar, nur für die Apps

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
